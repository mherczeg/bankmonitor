spring.application.name=global-payment-service

# Load-bearing, not a nicety: the app calls itself over HTTP to reach the
# stand-in FX provider, which a bounded thread pool can deadlock on. See
# docs/design-decisions.md 27-28.
spring.threads.virtual.enabled=true

# Every amount on the wire is a whole count of Minor Units. Jackson's default is to
# truncate a decimal into an integer field, which turns 100.50 euros into 100 cents with no
# error; off, it is a rejected field. See docs/design-decisions/09-create-account-endpoint.md.
spring.jackson.deserialization.accept-float-as-int=false

spring.datasource.url=jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# The H2 console is deliberately not enabled: the security chain denies /h2-console
# along with everything else it does not name, and the Flyway migration directory is
# the better answer to "show me the schema".

# Flyway owns the schema; Hibernate only checks the entities against it and
# never emits DDL. See docs/design-decisions.md 29.
spring.jpa.hibernate.ddl-auto=validate

# The Vite dev server, which runs as its own process on a different origin. A
# deployment that serves both from one origin sets this to its own.
payments.cors.allowed-origins=http://localhost:5173

# How long after one outbox run ends before the next begins. This is the delay between a
# change committing and the news of it leaving the process, so it is short enough that the
# lifecycle is watchable in the UI. No default in the annotation: one copy of the number.
payments.outbox.poll-delay=PT1S

# The Exchange Rate provider's root. Points at this application's own stand-in, which
# answers only under the mock-fx profile. A provider serving /fx/rates?base=&quote= in the
# same JSON is this one line; one serving a different shape is a second ExchangeRateProvider.
payments.fx.base-url=http://localhost:8080/mock

# A slow provider must not park a request holding an in-progress Idempotency Key, so
# both bounds are set. The read timeout is well above the stand-in's configurable
# latency, so raising that dial reaches the timeout path rather than a hung test.
payments.fx.connect-timeout=1s
payments.fx.read-timeout=2s

# Retries after the first attempt, so a failing provider is called three times. Deleting
# either line fails startup rather than changing the policy silently; ExchangeRateSettings
# says why they cannot hold their own defaults.
payments.fx.max-retries=2
payments.fx.retry-delay=100ms

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
