spring.application.name=global-payment-service

# --- Virtual threads -------------------------------------------------------
# Load-bearing, not a nicety. The stand-in Exchange Rate provider is a real HTTP
# endpoint inside this same application (design decision 28), so serving a
# transfer request means an inbound request thread makes an outbound HTTP call
# that a second thread of this same server must answer. On the classic pooled
# model those two threads come from one bounded pool, and the inbound thread
# parks holding a permit while waiting for the outbound one -- enough concurrent
# transfers and the pool deadlocks against itself.
#
# Virtual threads are cheap and unbounded, so a parked request costs no platform
# thread and that self-call cannot starve. It is also why design decision 27
# declines a circuit breaker: a breaker exists to protect a scarce thread pool,
# and here threads are not scarce.
spring.threads.virtual.enabled=true

# --- Database --------------------------------------------------------------
# H2 in-memory, which is what the application ships on and what the tests run
# against (design decision 25) -- Testcontainers was rejected so `./mvnw test`
# needs no Docker daemon.
#
# DB_CLOSE_DELAY=-1 keeps the in-memory database alive for the JVM's lifetime
# rather than dropping it when the last connection closes. Without it the schema
# would vanish the moment the connection pool went idle.
spring.datasource.url=jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# The H2 web console is deliberately NOT enabled. It would put an unauthenticated
# servlet at /h2-console, which hands ticket 04's security chain a decision it
# never asked for, and design decision 29 already answers "how does a reviewer
# see the schema?" better: the Flyway migration directory shows every table,
# constraint and index as SQL.

# NOTE: schema generation is deliberately left at the Boot default for now.
# Ticket 02 introduces Flyway and switches this to
# `spring.jpa.hibernate.ddl-auto=validate` (design decision 29); doing it here
# would mean `validate` with no migrations to validate against, and the
# application would not start.

# --- Actuator --------------------------------------------------------------
# Only the health endpoint is exposed. Actuator's other endpoints are
# operational surface this application has no need to publish.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
